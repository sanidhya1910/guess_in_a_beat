# Builds the site and publishes it to GitHub Pages.
# Runs on every push to master and once a day, so the Top 100 chart packs stay fresh.
# One-time setup: Settings > Pages > Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh chart packs
        run: npm run data:charts
        continue-on-error: true
      - run: npm test
      - run: npm run build
        env:
          # Project sites live under /<repo>/. Set a BASE_PATH repository
          # variable to "/" when using a custom domain.
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          # Origin used for absolute social-preview URLs.
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
