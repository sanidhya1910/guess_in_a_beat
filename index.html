<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Guess in a Beat: name the song in a split second</title>
        <meta
            name="description"
            content="A free music quiz. Hear a split second of a song and name it. Daily challenge, chart and decade packs, artist mode and challenges for friends. No sign-up."
        />
        <meta name="theme-color" content="#0d0d11" media="(prefers-color-scheme: dark)" />
        <meta name="theme-color" content="#f3f3f6" media="(prefers-color-scheme: light)" />
        <meta name="color-scheme" content="dark light" />

        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Guess in a Beat" />
        <meta property="og:title" content="Guess in a Beat" />
        <meta property="og:description" content="How fast can you name a song? A free music quiz with a new song every day." />
        <meta property="og:image" content="__OG_IMAGE__" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />

        <script>
            // Apply a saved theme before first paint to avoid a flash.
            try {
                var theme = JSON.parse(localStorage.getItem('gib:settings') || '{}').theme;
                if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        </script>
    </head>
    <body>
        <div id="root"></div>
        <noscript>Guess in a Beat needs JavaScript to play music.</noscript>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
